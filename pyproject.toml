[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopilot"
version = "0.1.0"
description = "Autonomous Driving Perception Framework"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Autopilot Team"}
]
keywords = [
    "autonomous-driving",
    "perception",
    "3d-detection",
    "deep-learning",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pytorch-lightning>=2.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "timm>=0.9.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "opencv-python>=4.7.0",
    "pillow>=9.4.0",
    "matplotlib>=3.7.0",
    "tensorboard>=2.12.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "einops>=0.6.0",
]

[project.optional-dependencies]
nuscenes = [
    "nuscenes-devkit>=1.1.10",
    "pyquaternion>=0.9.9",
]
waymo = [
    "waymo-open-dataset-tf-2-11-0",
]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.0.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.2.0",
    "pre-commit>=3.2.0",
]
all = [
    "autopilot[nuscenes,waymo,dev]",
]

[project.urls]
Homepage = "https://github.com/autopilot/autopilot"
Documentation = "https://github.com/autopilot/autopilot#readme"
Repository = "https://github.com/autopilot/autopilot"
Issues = "https://github.com/autopilot/autopilot/issues"

[project.scripts]
autopilot-train = "scripts.train:main"
autopilot-eval = "scripts.eval:main"
autopilot-infer = "scripts.inference:main"

[tool.setuptools.packages.find]
include = ["autopilot*"]

[tool.setuptools.package-data]
autopilot = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "build",
    "dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["autopilot"]
omit = ["tests/*"]
