type: Depth

backbone:
  type: ResNet
  depth: 34
  pretrained: true
  out_indices: [1, 2, 3, 4]
  frozen_stages: 1

neck:
  type: BiFPN
  in_channels: [64, 128, 256, 512]  # ResNet34
  out_channels: 256
  num_layers: 3

context:
  type: ContextAggregator
  in_channels: 256
  out_channels: 128
  num_levels: 4
  target_level: 1  # 1/8 scale
  fusion: concat

head:
  type: DepthHead
  num_bins: 33
  min_depth: 1.0
  max_depth: 150.0
  scale_factor: 8
  in_channels: 128
  inner_channels: 64
  loss_weight: 1.0
