# Depth Estimation Head Configuration

depth_head:
  type: DepthHead  # TODO: Implement

  # Input channels from neck
  in_channels: 256

  # Depth range
  min_depth: 1.0
  max_depth: 60.0

  # Number of depth bins for classification-based depth
  num_depth_bins: 80

  # Head architecture
  hidden_channels: 128
  num_conv_layers: 3

  # Output mode
  output_mode: bins  # bins, regression

  # Loss settings
  loss_type: si_log  # si_log (scale-invariant), l1, smooth_l1
  loss_weight: 1.0

  # Multi-scale supervision
  use_multi_scale: true
  scale_weights: [1.0, 0.5, 0.25]
