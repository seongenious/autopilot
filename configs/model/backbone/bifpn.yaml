# BiFPN Neck Configuration
# @package neck

type: BiFPN

# Input channels from backbone (must match backbone output)
# For regnetx_032: [96, 192, 432]
in_channels: [96, 192, 432]

# Output channels for all pyramid levels
out_channels: 256

# Number of feature pyramid levels
# If > len(in_channels), extra levels will be added via strided conv
num_levels: 5

# Number of BiFPN layers to stack
num_layers: 3

# Epsilon for numerical stability in weighted fusion
epsilon: 1.0e-4
