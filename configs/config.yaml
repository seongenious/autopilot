# @package _global_
# Base configuration for autopilot training

defaults:
  - model/backbone: resnet
  - model/neck: bifpn
  - model/head: detection
  - dataset: nuscenes
  - training: default
  - _self_

# Experiment settings
experiment:
  name: ${model.backbone.type}_${dataset.name}
  seed: 42
  deterministic: false

# Output directories
output:
  root_dir: outputs
  exp_dir: ${output.root_dir}/${experiment.name}
  checkpoint_dir: ${output.exp_dir}/checkpoints
  log_dir: ${output.exp_dir}/logs

# Hydra configuration
hydra:
  run:
    dir: ${output.exp_dir}
  sweep:
    dir: ${output.root_dir}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
