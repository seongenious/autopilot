# nuScenes dataset configuration
name: nuscenes
type: NuScenesDataset

# Data paths
data_root: data/nuscenes
ann_file: data/nuscenes/nuscenes_infos_train.pkl
val_ann_file: data/nuscenes/nuscenes_infos_val.pkl

# Point cloud range [x_min, y_min, z_min, x_max, y_max, z_max]
pc_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]
voxel_size: [0.2, 0.2, 8.0]

# Camera settings
num_cameras: 6
img_size: [900, 1600]  # H, W
img_norm_cfg:
  mean: [123.675, 116.28, 103.53]
  std: [58.395, 57.12, 57.375]
  to_rgb: true

# Class names
class_names:
  - car
  - truck
  - construction_vehicle
  - bus
  - trailer
  - barrier
  - motorcycle
  - bicycle
  - pedestrian
  - traffic_cone

# Data augmentation
train_pipeline:
  - type: LoadMultiViewImageFromFiles
  - type: LoadAnnotations3D
  - type: RandomFlip3D
    flip_ratio: 0.5
  - type: NormalizeMultiviewImage
    mean: ${dataset.img_norm_cfg.mean}
    std: ${dataset.img_norm_cfg.std}
  - type: PadMultiViewImage
    size_divisor: 32
  - type: FormatBundle3D
  - type: Collect3D
    keys: [img, gt_bboxes_3d, gt_labels_3d]

val_pipeline:
  - type: LoadMultiViewImageFromFiles
  - type: NormalizeMultiviewImage
    mean: ${dataset.img_norm_cfg.mean}
    std: ${dataset.img_norm_cfg.std}
  - type: PadMultiViewImage
    size_divisor: 32
  - type: FormatBundle3D
  - type: Collect3D
    keys: [img]

# Dataloader settings
dataloader:
  batch_size: 4
  num_workers: 4
  shuffle: true
  drop_last: true
  pin_memory: true
