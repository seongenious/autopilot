# nuScenes Dataset Configuration
# @package dataset
type: NuScenesDataset
name: nuscenes

# Data paths (symlink your dataset to data/nuscenes)
data_root: data/nuscenes
train_ann_file: ${dataset.data_root}/nuscenes_infos_train.pkl
val_ann_file: ${dataset.data_root}/nuscenes_infos_val.pkl
test_ann_file: ${dataset.data_root}/nuscenes_infos_test.pkl

# Dataset version
version: v1.0-trainval  # v1.0-trainval, v1.0-mini

# Class configuration
classes:
  - car
  - truck
  - trailer
  - bus
  - construction_vehicle
  - bicycle
  - motorcycle
  - pedestrian
  - traffic_cone
  - barrier

# Point cloud range [x_min, y_min, z_min, x_max, y_max, z_max]
point_cloud_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]

# Voxel size for BEV
voxel_size: [0.2, 0.2, 8.0]

# Image configuration
img_size: [640, 960]  # [H, W]
img_norm_cfg:
  mean: [123.675, 116.28, 103.53]
  std: [58.395, 57.12, 57.375]
  to_rgb: true

# Camera names
cameras:
  - CAM_FRONT
  - CAM_FRONT_RIGHT
  - CAM_FRONT_LEFT
  - CAM_BACK
  - CAM_BACK_LEFT
  - CAM_BACK_RIGHT

# Data loading
use_valid_flag: true
use_lidar: false  # Camera-only by default

# Dataloader settings
batch_size: 1  # Reduced from 4 to avoid OOM on 16GB GPUs
shuffle: true
