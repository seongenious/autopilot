# nuScenes dataset configuration for multi-camera 3D perception
name: nuscenes
type: NuScenesDataset

# Data paths
data_root: data/nuscenes
version: v1.0-trainval  # v1.0-trainval, v1.0-mini, v1.0-test

# Image settings
img_size: [900, 1600]  # H, W (original nuScenes image size)
crop_size: [448, 800]  # H, W (training crop)
img_norm_cfg:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# Camera settings
num_cameras: 6
camera_names:
  - CAM_FRONT
  - CAM_FRONT_RIGHT
  - CAM_BACK_RIGHT
  - CAM_BACK
  - CAM_BACK_LEFT
  - CAM_FRONT_LEFT

# Detection class settings (12 classes)
num_classes: 12
class_names:
  - car
  - truck
  - construction_vehicle
  - bus
  - trailer
  - barrier
  - motorcycle
  - bicycle
  - pedestrian
  - traffic_cone
  - emergency_vehicle
  - misc  # unclassifiable objects (animal, etc.)

# BEV range [x_min, y_min, z_min, x_max, y_max, z_max] in meters
bev_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]
bev_resolution: 0.4  # meters per pixel

# Temporal settings
max_sweeps: 0  # Number of sweeps for temporal context (0 = keyframes only)

# Annotation settings
use_valid_flag: true

# Dataloader settings
dataloader:
  train:
    batch_size: 2
    num_workers: 4
    shuffle: true
    drop_last: true
    pin_memory: true
  val:
    batch_size: 1
    num_workers: 4
    shuffle: false
    drop_last: false
    pin_memory: true
