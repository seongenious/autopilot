# Waymo Open Dataset Configuration
# @package dataset

type: WaymoDataset
name: waymo

# Data paths (symlink your dataset to data/waymo)
data_root: data/waymo
train_ann_file: ${dataset.data_root}/waymo_infos_train.pkl
val_ann_file: ${dataset.data_root}/waymo_infos_val.pkl
test_ann_file: ${dataset.data_root}/waymo_infos_test.pkl

# Class configuration
classes:
  - Vehicle
  - Pedestrian
  - Cyclist

# Point cloud range [x_min, y_min, z_min, x_max, y_max, z_max]
point_cloud_range: [-75.2, -75.2, -2.0, 75.2, 75.2, 4.0]

# Voxel size for BEV
voxel_size: [0.1, 0.1, 0.15]

# Image configuration
img_size: [640, 960]  # [H, W]
img_norm_cfg:
  mean: [123.675, 116.28, 103.53]
  std: [58.395, 57.12, 57.375]
  to_rgb: true

# Camera names
cameras:
  - FRONT
  - FRONT_LEFT
  - FRONT_RIGHT
  - SIDE_LEFT
  - SIDE_RIGHT

# Data loading
load_interval: 1  # Use all frames (5 for faster training)
use_lidar: false  # Camera-only by default

# Dataloader settings
batch_size: 4
shuffle: true
