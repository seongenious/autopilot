# Training Configuration
# @package training

# Epochs and steps
max_epochs: 5
val_check_interval: 1.0  # Validate every epoch

# Optimizer
optimizer:
  type: AdamW
  lr: 2.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]

# Learning rate scheduler
scheduler:
  type: CosineAnnealingLR
  T_max: ${training.max_epochs}
  eta_min: 1.0e-7

# Warmup
warmup:
  enabled: true
  warmup_epochs: 1
  warmup_lr: 1.0e-6

# Gradient clipping
gradient_clip_val: 35.0
gradient_clip_algorithm: norm

# Accumulation for larger effective batch size
accumulate_grad_batches: 4  # Effective batch size = batch_size * accumulate_grad_batches

# EMA (Exponential Moving Average)
ema:
  enabled: false
  decay: 0.999

# Checkpointing
checkpoint:
  save_top_k: 3
  monitor: val/loss
  mode: min
  save_last: true

# Early stopping
early_stopping:
  enabled: false
  patience: 5
  monitor: val/loss
  mode: min

# Augmentation settings
augmentation:
  # Spatial augmentation
  random_flip:
    enabled: true
    prob: 0.5

  global_rotate:
    enabled: true
    range: [-0.3925, 0.3925]  # [-22.5, 22.5] degrees

  global_scale:
    enabled: true
    range: [0.95, 1.05]

  # Image augmentation
  color_jitter:
    enabled: true
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
