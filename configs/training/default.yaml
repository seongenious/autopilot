# Training configuration
trainer:
  max_epochs: 24
  accelerator: auto
  devices: auto
  precision: 16-mixed
  gradient_clip_val: 35.0
  accumulate_grad_batches: 1
  log_every_n_steps: 50
  val_check_interval: 1.0
  check_val_every_n_epoch: 1

optimizer:
  type: AdamW
  lr: 2.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]

scheduler:
  type: CosineAnnealingLR
  T_max: ${training.trainer.max_epochs}
  eta_min: 1.0e-7

callbacks:
  model_checkpoint:
    monitor: val/loss
    mode: min
    save_top_k: 3
    save_last: true
  early_stopping:
    monitor: val/loss
    patience: 5
    mode: min
  lr_monitor:
    logging_interval: step
